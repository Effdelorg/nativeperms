name: nativeprems
description: A Flutter permissions plugin with native iOS Swift Package Manager support.
version: 0.1.0
homepage: https://github.com/Effdelorg/nativeprems
repository: https://github.com/Effdelorg/nativeprems
issue_tracker: https://github.com/Effdelorg/nativeprems/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  meta: ^1.16.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.effdel.nativeprems
        pluginClass: NativePermsPlugin
      ios:
        pluginClass: NativePermsPlugin
        sharedDarwinSource: false
      web:
        pluginClass: NativePermsWeb
        fileName: nativeprems_web.dart
      windows:
        pluginClass: NativePermsPluginCApi
